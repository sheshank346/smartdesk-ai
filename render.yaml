services:
  - type: web
    name: smartdesk-ai-backend
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python ingest.py"
    startCommand: "uvicorn api:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
